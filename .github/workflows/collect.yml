name: Collect football news

# Vercel Hobby의 cron은 하루 1회 제한이라 스케줄은 여기에 둔다.
# GitHub Actions는 퍼블릭 저장소 무료 (프라이빗은 월 2,000분).
#
# 한 IP에서 244명을 20분마다 전부 조회하면 Google News에 429를 맞는다.
# 그래서 신뢰도에 따라 조회 주기를 나눈다:
#   hot  (20분) — 0티어 27명 + 매체 23곳   ≈ 50 요청
#   warm (1시간) — 1.5티어 이하를 3등분     ≈ 55 요청
#   cold (6시간) — 전 티어를 4등분          ≈ 61 요청
on:
  schedule:
    - cron: "*/20 * * * *"
    - cron: "7 * * * *"
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      band:
        description: "hot | warm | cold"
        default: hot
        type: choice
        options: [hot, warm, cold]

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pick collection band
        id: band
        run: |
          case "${{ github.event.schedule }}" in
            "7 * * * *")    BAND=warm ;;
            "23 */6 * * *") BAND=cold ;;
            "*/20 * * * *") BAND=hot ;;
            *)              BAND="${{ inputs.band || 'hot' }}" ;;
          esac

          HOUR=$((10#$(date -u +%H)))
          case "$BAND" in
            hot)  ARGS="--tier 0" ;;
            warm) ARGS="--tier 1.5 --no-outlets --slice $((HOUR % 3))/3" ;;
            cold) ARGS="--tier 3   --no-outlets --slice $(((HOUR / 6) % 4))/4" ;;
          esac

          echo "band=$BAND" >> "$GITHUB_OUTPUT"
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "▶ $BAND: npm run collect -- $ARGS"

      # Registries rarely change; only the cheap hot run needs to re-sync them.
      - name: Seed registries
        if: steps.band.outputs.band == 'hot'
        run: npm run seed

      - name: Collect articles
        run: npm run collect -- ${{ steps.band.outputs.args }}

      # Google News and club sitemaps carry no description, so more than half
      # the feed arrives with nothing to expand. This resolves the real article
      # address, and reads the summary and the byline out of the page's own
      # metadata. 150 rather than 80 while the backlog of author-less articles
      # drains: at 80 a pass covers 5,700 a day, and there were 10,000 waiting.
      - name: Fetch article summaries
        run: npm run hydrate -- --limit 150

      # Google's public translate backend is the default and needs no key;
      # MyMemory catches whatever it drops, and ANTHROPIC_API_KEY upgrades the
      # engine if one is ever set. Every engine's output goes through the
      # Korean headline pass in lib/collect/korean.ts.
      - name: Translate headlines
        run: npm run translate -- --limit 150
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # Destinations are rows in the database, registered from the UI — no env
      # vars, and no redeploy to change who gets what.
      - name: Push Discord alerts
        run: npm run notify
