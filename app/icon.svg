<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Tab icon: the mark, cropped to the ball and ribbon and nudged to fill the
       tile. The drop shadows and the small patches are dropped — at 16px they
       only muddy it. -->
  <defs>
    <linearGradient id="o" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3E00" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>
    <radialGradient id="b" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
  </defs>

  <rect width="200" height="200" rx="44" fill="#0E1015" />
  <g transform="translate(8,-6)">
    <circle cx="90" cy="110" r="65" fill="#1E2838" />
    <circle cx="90" cy="110" r="62" fill="url(#b)" />
    <polygon points="90,75 72,88 78,108 102,108 108,88" fill="#1E293B" />
    <polygon points="78,108 60,120 68,138 88,138 98,122" fill="#334155" />
    <path d="M 35 125 C 30 160, 80 175, 125 150 C 160 130, 165 70, 155 40"
          fill="none" stroke="url(#o)" stroke-width="22" stroke-linecap="round" />
    <path d="M 135 45 L 165 25 L 165 65 Z" fill="#FF5500" />
  </g>
</svg>
