<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Tab icon. The full mark's panel work disappears at 16px, so this keeps only
    what survives: a dark ball, one white pentagon, and the orange ribbon
    breaking out into an arrow.
  -->
  <defs>
    <linearGradient id="ball" x1="14" y1="14" x2="46" y2="52">
      <stop offset="0" stop-color="#3C5170" />
      <stop offset="1" stop-color="#0D1725" />
    </linearGradient>
    <linearGradient id="ribbon" x1="6" y1="54" x2="60" y2="6">
      <stop offset="0" stop-color="#C42A00" />
      <stop offset=".5" stop-color="#F06000" />
      <stop offset="1" stop-color="#FF9E3D" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0E1015" />
  <circle cx="28" cy="34" r="15.5" fill="url(#ball)" />
  <path d="M28 25l6.2 4.5-2.4 7.3h-7.6l-2.4-7.3z" fill="#EEF2F8" />
  <path
    d="M13.6 44.6A19.5 19.5 0 1 0 45.4 23.7"
    stroke="url(#ribbon)"
    stroke-width="6.4"
    stroke-linecap="round"
    fill="none"
  />
  <path d="M55.6 15.6 44.6 20.1l8.2 7.6z" fill="url(#ribbon)" />
</svg>
